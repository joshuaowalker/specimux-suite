[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specimux-suite"
version = "0.2.1"
description = "Orchestration and UX layer for the Mycomap fungal DNA barcoding pipeline"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Josh Walker", email = "joshowalker@yahoo.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["bioinformatics", "nanopore", "sequencing", "barcoding", "pipeline", "dashboard"]
dependencies = [
    "specimux>=0.7.2",          # Profiles + progress protocol
    "speconsense>=0.7.0",       # Profiles
    "watchdog>=3.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sse-starlette>=1.8",
    "adjusted-identity>=0.2.4",
    "biopython>=1.82",
    "pyyaml>=5.0",
]

[project.urls]
Homepage = "https://github.com/joshuaowalker/specimux-suite"
Repository = "https://github.com/joshuaowalker/specimux-suite"
Issues = "https://github.com/joshuaowalker/specimux-suite/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    # The web tests talk to a live uvicorn thread with httpx; starlette's
    # TestClient needs httpx before 1.0 and the httpx2 package from 1.0 on
    "httpx>=0.27,<0.29",
    "httpx2>=2.0",
]

[project.scripts]
specimux-suite = "specimux_suite.cli:main"
specimux-replay = "specimux_suite.cli:replay_main"

# Plugins the engine can load by name (--plugin NAME); other packages
# register theirs in the same group
[project.entry-points."specimux_suite.plugins"]
forward = "specimux_suite.forward:forwarder_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specimux_suite.profiles" = ["*.yaml"]
# The dashboard is served from package data — dropping these breaks the web UI
"specimux_suite.web" = ["static/*.html", "static/*.js", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
