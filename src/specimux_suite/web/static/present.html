<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specimux-suite · highlights</title>
<style>
  /* Projector mode: warm brown-black ground (a dark room, not a terminal),
     spore-print cream text, chanterelle amber accent. All system faces —
     no webfonts, the venue network can't be a dependency. */
  :root {
    --bg: #100d0b;
    --surface: #1a1512;
    --text: #efe7da;
    --muted: #9a8c7a;
    --faint: #5c5248;
    --amber: #e8a33d;
    --amber-dim: #8a6224;
    --base-a: #7fa65a;
    --base-c: #5a8fa6;
    --base-g: #a67f5a;
    --base-t: #a65a6b;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    cursor: none;
  }
  body.show-cursor { cursor: default; }

  #stage { position: absolute; inset: 0 0 3.2rem 0; }

  .card {
    position: absolute; inset: 0;
    display: flex;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .card.visible { opacity: 1; }

  /* ---- identification card ---- */
  .card .text-pane {
    flex: 1 1 55%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 4vw 3vw 6vh 5vw;
    min-width: 0;
    position: relative; z-index: 2;
  }
  .card .photo-pane {
    flex: 1 1 45%;
    position: relative;
    overflow: hidden;
  }
  .card .photo-pane img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* photo bleeds into the dark ground rather than ending at a seam */
  .card .photo-pane::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, var(--bg) 0%, transparent 22%),
                linear-gradient(0deg, var(--bg) 0%, transparent 18%);
  }
  .card.no-photo .photo-pane { display: none; }
  .card.no-photo .text-pane { padding-right: 8vw; }

  .eyebrow {
    font-size: clamp(0.9rem, 1.6vw, 1.4rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 2.2vh;
    animation: rise 0.9s ease both;
  }
  .eyebrow .flag { color: var(--muted); }

  .binomial {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    line-height: 0.98;
    font-size: clamp(3rem, 7.5vw, 8rem);
    animation: rise 0.9s 0.15s ease both;
  }
  .binomial .epithet { display: block; color: var(--text); }
  .binomial .genus { display: block; }
  /* "aff." qualifier and open questions are set roman, as in print floras */
  .binomial .aff { font-style: normal; color: var(--amber); font-size: 0.55em; margin-right: 0.12em; }
  .binomial .undescribed { font-style: normal; color: var(--amber); font-size: 0.5em; letter-spacing: 0.02em; }

  .datarow {
    font-family: var(--mono);
    font-size: clamp(1rem, 1.9vw, 1.7rem);
    color: var(--muted);
    margin-top: 3.5vh;
    display: flex; flex-wrap: wrap; gap: 0.4em 1.6em;
    animation: rise 0.9s 0.3s ease both;
  }
  .datarow .identity { color: var(--text); }
  .datarow .identity.novel { color: var(--amber); }

  .fieldrow {
    font-size: clamp(0.95rem, 1.6vw, 1.35rem);
    color: var(--muted);
    margin-top: 1.6vh;
    animation: rise 0.9s 0.45s ease both;
  }
  .fieldrow .ok { color: var(--base-a); }
  .fieldrow .fieldname { font-style: italic; font-family: var(--serif); }

  .creditrow {
    font-size: clamp(0.85rem, 1.3vw, 1.1rem);
    color: var(--faint);
    margin-top: 4vh;
    animation: rise 0.9s 0.6s ease both;
  }
  .creditrow b { color: var(--muted); font-weight: 500; }

  /* novel variants: the one loud moment. Soft (<98%) gets a steady amber
     bar; strong (<90%) pulses. */
  .card.novel .text-pane::before,
  .card.novel-soft .text-pane::before {
    content: ''; position: absolute; left: 0; top: 10%; bottom: 10%;
    width: 4px; background: var(--amber);
  }
  .card.novel .text-pane::before { animation: glowbar 2.4s ease-in-out infinite; }
  .card.novel-soft .text-pane::before { opacity: 0.55; }
  @keyframes glowbar {
    0%, 100% { opacity: 0.5; } 50% { opacity: 1; }
  }

  /* similarity gauge: how far this sequence sits from anything known */
  .gauge { margin-top: 3.5vh; max-width: 40vw; animation: rise 0.9s 0.3s ease both; }
  .card.no-photo .gauge { max-width: 60vw; }
  .gauge-label {
    font-family: var(--mono);
    font-size: clamp(0.95rem, 1.6vw, 1.4rem);
    color: var(--muted); margin-bottom: 1.4vh;
  }
  .gauge-label b { color: var(--amber); font-weight: 600; }
  .gauge-track {
    position: relative; height: 6px; border-radius: 3px;
    background: #2a231d;
  }
  .gauge-zone {
    position: absolute; top: 0; bottom: 0; right: 0; border-radius: 0 3px 3px 0;
    background: #3d4a33;
  }
  .gauge-marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 14px rgba(232, 163, 61, 0.55);
  }
  .card.novel .gauge-marker { animation: glowbar 2.4s ease-in-out infinite; }
  .gauge-ticks {
    position: relative; height: 1.6em; margin-top: 0.9vh;
    font-family: var(--mono);
    font-size: clamp(0.75rem, 1.1vw, 1rem);
    color: var(--faint);
  }
  .gauge-ticks .zone-tick { position: absolute; right: 0; white-space: nowrap; }

  /* ---- sequence ribbon: the specimen's actual consensus bases ---- */
  .ribbon {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 2.1rem; line-height: 2.1rem;
    font-family: var(--mono);
    font-size: 1.05rem;
    letter-spacing: 0.35em;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0.5;
    z-index: 3;
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .ribbon .scroll { display: inline-block; animation: ribbonscroll 80s linear infinite; }
  @keyframes ribbonscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ribbon .A { color: var(--base-a); } .ribbon .C { color: var(--base-c); }
  .ribbon .G { color: var(--base-g); } .ribbon .T { color: var(--base-t); }

  /* ---- stats + leaderboard cards ---- */
  .card .stat-pane {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 6vw;
  }
  .stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 3vw; margin-top: 5vh;
  }
  .stat .num {
    font-family: var(--mono);
    font-size: clamp(2.6rem, 6.5vw, 6.5rem);
    color: var(--text);
    animation: rise 0.9s ease both;
  }
  .stat:nth-child(2) .num { animation-delay: 0.15s; }
  .stat:nth-child(3) .num { animation-delay: 0.3s; }
  .stat .lbl {
    font-size: clamp(0.9rem, 1.5vw, 1.3rem);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin-top: 1vh;
  }

  .board { margin-top: 4vh; }
  .board-row {
    display: flex; align-items: baseline; gap: 2vw;
    font-size: clamp(1.3rem, 2.6vw, 2.6rem);
    padding: 1.4vh 0;
    border-bottom: 1px solid #2a231d;
    animation: rise 0.7s ease both;
  }
  .board-row:nth-child(2) { animation-delay: 0.1s; }
  .board-row:nth-child(3) { animation-delay: 0.2s; }
  .board-row:nth-child(4) { animation-delay: 0.3s; }
  .board-row:nth-child(5) { animation-delay: 0.4s; }
  .board-row .rank { font-family: var(--mono); color: var(--faint); min-width: 2ch; }
  .board-row .who { flex: 1; }
  .board-row .count { font-family: var(--mono); color: var(--amber); }

  /* ---- milestone card: one huge number, the room should look up ---- */
  .milestone-num {
    font-family: var(--sans);
    font-weight: 200;
    font-size: clamp(5rem, 17vw, 17rem);
    line-height: 1;
    color: var(--amber);
    animation: rise 0.9s 0.1s ease both;
  }
  .milestone-lbl {
    font-size: clamp(1.1rem, 2.4vw, 2.2rem);
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-top: 2.5vh;
    animation: rise 0.9s 0.35s ease both;
  }

  /* ---- burst roll-up: a busy stretch collapsed into one card ---- */
  .burst-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0.8vh 4vw; margin-top: 4.5vh;
  }
  .burst-item {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(1.05rem, 2vw, 1.9rem);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: rise 0.7s ease both;
  }
  .burst-item.first { color: var(--amber); }
  .burst-item .pct {
    font-family: var(--mono); font-style: normal;
    color: var(--faint); font-size: 0.68em; margin-left: 0.6em;
  }

  /* ---- family portrait: taxonomic breakdown bars ---- */
  .taxo-row {
    display: grid; grid-template-columns: minmax(10ch, 0.34fr) 1fr auto;
    align-items: center; gap: 2vw;
    font-size: clamp(1.05rem, 2.1vw, 2rem);
    padding: 1vh 0;
    animation: rise 0.7s ease both;
  }
  .taxo-row .fam {
    font-family: var(--serif); font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .taxo-row .bar {
    display: block; height: 0.8em; border-radius: 3px;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    min-width: 4px;
    transform-origin: left; animation: growbar 0.9s ease both;
  }
  .taxo-row .n { font-family: var(--mono); color: var(--muted); }
  @keyframes growbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---- refinement journeys: field ID sharpened at the tables ---- */
  .journey-row {
    font-size: clamp(1.05rem, 2.1vw, 2rem);
    padding: 1.4vh 0;
    border-bottom: 1px solid #2a231d;
    animation: rise 0.7s ease both;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .journey-row .fieldname { font-family: var(--serif); font-style: italic; }
  .journey-row .arrow { color: var(--amber); margin: 0 0.5em; }
  .journey-row .ok { color: var(--base-a); font-size: 0.72em; margin-left: 1.2em; }
  .journey-row .n { font-family: var(--mono); color: var(--faint); font-size: 0.72em; margin-left: 0.8em; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(1.2vh); }
    to { opacity: 1; transform: none; }
  }

  /* ---- footer: ambient proof of life ---- */
  #footer {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3.2rem;
    display: flex; align-items: center;
    padding: 0 1.6rem;
    gap: 2rem;
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--faint);
    border-top: 1px solid #221c17;
    background: var(--bg);
    z-index: 5;
  }
  #footer .wordmark { color: var(--muted); letter-spacing: 0.12em; }
  #footer .counters { display: flex; gap: 2rem; margin-left: auto; }
  #footer .counters b { color: var(--muted); font-weight: 500; }
  #conn-dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%;
    background: var(--base-a); flex: none;
  }
  #conn-dot.down { background: var(--base-t); animation: glowbar 1.2s infinite; }
  #paused-tag { color: var(--amber); display: none; }

  @media (max-width: 720px) {
    .card { flex-direction: column-reverse; }
    .card .photo-pane { flex: 1 1 40%; }
    .card .photo-pane::before {
      background: linear-gradient(0deg, transparent 60%, var(--bg) 100%);
    }
    .card .text-pane { flex: 1 1 60%; padding: 2vh 6vw 5vh 6vw; justify-content: flex-start; }
    .gauge, .card.no-photo .gauge { max-width: 88vw; }
    .stat-grid { grid-template-columns: 1fr; gap: 2vh; }
    #footer .counters { gap: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ribbon .scroll { animation: none; }
    .eyebrow, .binomial, .datarow, .fieldrow, .creditrow, .stat .num, .board-row,
    .milestone-num, .milestone-lbl, .burst-item, .taxo-row, .taxo-row .bar, .journey-row { animation: none; }
    .card { transition: opacity 0.2s ease; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="footer">
  <div id="conn-dot"></div>
  <span class="wordmark">specimux-suite · live</span>
  <span id="paused-tag">paused — space to resume</span>
  <div class="counters">
    <span><b id="ct-reads">0</b> reads matched</span>
    <span><b id="ct-identified">0</b> identified</span>
    <span><b id="ct-genera">0</b> genera</span>
  </div>
</div>

<script src="/static/derived.js"></script>
<script>
'use strict';

// ============================================================
// Minimal state mirror (same event semantics as index.html /
// state.py — keep the top-match logic in sync with index.html)
// ============================================================
const state = {
  version: 0,
  specimens: {},   // sid -> {..._specimen_to_dict fields we use}
  totalMatched: 0,
  genusLineages: {},  // genus_lower -> [{id, rank, name}] root→genus
  summarizeFilter: {},  // effective NS/LQ/chimera routing settings
};

// Shared decision logic lives in derived.js; these adapters bind it to this
// page's state. Anything beyond a one-line delegation belongs in derived.js.
const { hasIdentification, isHitOnTarget, hitIdentity, GENUS_OR_DEEPER_RANKS, NEAR_RANKS } = SpecimuxDerived;
function clusterFlagged(cluster) { return SpecimuxDerived.clusterFilterRouting(cluster, state.summarizeFilter); }
function getTopMatch(s) { return SpecimuxDerived.getTopMatch(s, 'clusters', state.summarizeFilter); }
function getTopHit(s) { const m = getTopMatch(s); return m ? m.top_hits[0] : null; }
function agreementRank(s, hit) { return SpecimuxDerived.agreementRank(s, hit, state.genusLineages); }

function getSpec(sid) {
  if (!state.specimens[sid]) {
    state.specimens[sid] = {
      specimen_id: sid, total_reads: 0, status: 'waiting',
      clusters: [], identification: [], variants: [],
      consensus_version: 0,
      community_taxon: '', community_genus: '', community_iconic_taxon: '',
      inat_photos: [], inat_observer: {}, inat_ancestors: [], inat_first_id: {},
    };
  }
  return state.specimens[sid];
}

function applyEvent(event) {
  const d = event.data;
  switch (event.type) {
    case 'specimens.loaded':
      for (const s of (d.specimens || [])) getSpec(s.specimen_id);
      break;
    case 'specimens.taxa':
      for (const [sid, taxon] of Object.entries(d.taxa || {})) {
        const s = getSpec(sid);
        if (typeof taxon === 'object') {
          s.community_taxon = taxon.name || '';
          s.community_genus = taxon.genus || '';
          s.community_iconic_taxon = taxon.iconic_taxon || '';
          s.inat_photos = taxon.photos || [];
          s.inat_observer = taxon.observer || {};
          s.inat_ancestors = taxon.ancestors || [];
          s.inat_first_id = taxon.first_id || {};
        } else {
          s.community_taxon = taxon;
          s.community_genus = taxon ? taxon.split(/\s+/)[0] : '';
        }
      }
      break;
    case 'taxa.lineage':
      for (const [genus, lineage] of Object.entries(d.lineages || {})) {
        state.genusLineages[genus.toLowerCase()] = lineage;
      }
      break;
    case 'specimux.completed':
      for (const [sid, count] of Object.entries(d.specimens || {})) {
        getSpec(sid).total_reads = count;
      }
      state.totalMatched = Object.values(state.specimens)
        .reduce((a, s) => a + (s.total_reads || 0), 0);
      break;
    case 'specimen.updated': {
      const s = getSpec(d.specimen_id);
      if (d.total_reads != null) s.total_reads = d.total_reads;
      if (d.consensus_version != null) s.consensus_version = d.consensus_version;
      break;
    }
    case 'consensus.completed': {
      const s = getSpec(d.specimen_id);
      s.status = 'consensus_done';
      s.consensus_version = (s.consensus_version || 0) + 1;
      s.identification = [];
      s.clusters = d.clusters || [];
      break;
    }
    case 'identification.completed': {
      const s = getSpec(d.specimen_id);
      if (d.consensus_version != null && d.consensus_version !== s.consensus_version) break;
      const matches = d.matches || [];
      const newClusters = new Set(matches.map(m => m.cluster));
      s.identification = s.identification.filter(m => !newClusters.has(m.cluster)).concat(matches);
      const hasHits = matches.some(m => (m.top_hits || []).length > 0);
      if (s.status !== 'summarized') s.status = hasHits ? 'identified' : 'no_match';
      if (hasHits) onIdentification(s);
      break;
    }
    case 'summarize.completed': {
      const s = getSpec(d.specimen_id);
      // Drop superseded generations (mirrors state.py)
      if (d.consensus_version != null && d.consensus_version !== s.consensus_version) break;
      s.status = 'summarized';
      s.variants = d.variants || [];
      break;
    }
  }
}

// Genus with display casing (for card copy — derived.js's hitGenusLower is
// the comparison form).
function hitGenus(h) { return h ? (h.name || h.ref_id || '').split(/\s+/)[0] : ''; }

function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
function fmt(n) { return (n || 0).toLocaleString('en-US'); }

// Local photo cache first; fall back to the iNat host if not prefetched yet.
function photoSources(photo) {
  return {
    local: `/photos/${photo.id}_large.jpg`,
    remote: (photo.url || '').replace('/square.', '/large.'),
  };
}

// ============================================================
// Card engine: priority queue + rate-adaptive dwell + filler
// ============================================================
const DWELL = { base: 12000, busy: 7000, slammed: 5000, stats: 9000 };
const NOVEL_SOFT = 0.98, NOVEL_STRONG = 0.90;
// When this many identifications are waiting, one burst card honors them
// together — dwell-shortening alone would blur past every individual
// moment. Strong novelty and milestones still play solo; first-of-genus
// joins the burst under load (amber in the grid) but gets a solo card
// when the room is quiet.
const BURST_MIN = 6, BURST_MAX = 12;
// Run milestones: fired live when a count crosses a threshold; thresholds
// already passed at bootstrap are seeded as announced (snapshot is history).
const MILESTONES = {
  identified: [25, 50, 100, 150, 200, 300, 400, 500, 750, 1000],
  genera: [10, 25, 50, 75, 100, 150],
  taxa: [25, 50, 100, 150, 200, 300],
  matched: [50000, 100000, 250000, 500000, 1000000, 2000000],
};
const MILESTONE_LABELS = {
  identified: 'specimens identified', genera: 'genera recorded',
  taxa: 'distinct taxa', matched: 'reads matched',
};
const passedMilestones = new Set();
// Announcement gate: a low identity from a thin cluster is as likely noise
// as novelty. The loud treatments (amber card, priority boost) require this
// much read support behind the matched sequence; below it the card renders
// as a plain identification.
const NOVEL_MIN_CLUSTER_READS = 20;

function novelSupported(s, match) {
  if (!match) return false;
  const cluster = (s.clusters || []).find(c => c.name === match.cluster);
  return !!cluster && (cluster.size || 0) >= NOVEL_MIN_CLUSTER_READS;
}

const queue = [];              // [{key, type, priority, sid, at}]
const announcedGenera = new Set();  // genera already seen this run
const lastShown = {};          // sid -> timestamp (for highlight recycling)
let fillerIdx = 0;
let paused = false;
let dwellTimer = null;
let currentCardEl = null;
let bootstrapped = false;

function enqueue(card) {
  const i = queue.findIndex(c => c.key === card.key);
  if (i >= 0) queue.splice(i, 1);
  queue.push(card);
  queue.sort((a, b) => a.priority - b.priority || a.at - b.at);
}

// Called from applyEvent when a specimen gains/refreshes hits. During
// bootstrap-replay nothing fires (the snapshot is history, not news).
function onIdentification(s) {
  if (!bootstrapped) return;
  const hit = getTopHit(s);
  if (!hit) return;
  const identity = hitIdentity(hit);
  const genus = hitGenus(hit);
  const firstOfGenus = genus && !announcedGenera.has(genus.toLowerCase());
  let priority = 3;
  if (identity < NOVEL_STRONG && novelSupported(s, getTopMatch(s))) priority = 1;
  else if (firstOfGenus) priority = 2;
  enqueue({ key: s.specimen_id, type: 'identification', priority, sid: s.specimen_id, at: Date.now(), firstOfGenus });
}

function nextDwell(type) {
  if (type !== 'identification') return DWELL.stats;
  if (queue.length > 15) return DWELL.slammed;
  if (queue.length > 5) return DWELL.busy;
  return DWELL.base;
}

// Each filler type gates on having enough data to be worth a card, so early
// in a run the rotation degrades to highlights + stats.
function pickFiller() {
  const rotation = ['highlight', 'stats', 'highlight', 'families', 'highlight',
                    'leaderboard', 'highlight', 'refined', 'highlight', 'fieldids'];
  for (let i = 0; i < rotation.length; i++) {
    const type = rotation[(fillerIdx + i) % rotation.length];
    if (type === 'highlight') {
      const sid = pickHighlight();
      if (sid) { fillerIdx += i + 1; return { type: 'identification', sid, recycled: true }; }
    } else if (type === 'leaderboard') {
      if (leaderboardRows().length >= 2) { fillerIdx += i + 1; return { type: 'leaderboard' }; }
    } else if (type === 'fieldids') {
      if (fieldIdRows().length >= 2) { fillerIdx += i + 1; return { type: 'fieldids' }; }
    } else if (type === 'families') {
      if (familyRows().length >= 3) { fillerIdx += i + 1; return { type: 'families' }; }
    } else if (type === 'refined') {
      if (refinedRows().length >= 2) { fillerIdx += i + 1; return { type: 'refined' }; }
    } else {
      fillerIdx += i + 1; return { type: 'stats' };
    }
  }
  return { type: 'stats' };
}

// Least-recently-shown identified specimen with a photo; novel ones first.
function pickHighlight() {
  const candidates = Object.values(state.specimens)
    .filter(s => hasIdentification(s) && (s.inat_photos || []).length);
  if (!candidates.length) return null;
  candidates.sort((a, b) => {
    const an = (hitIdentity(getTopHit(a)) < NOVEL_SOFT && novelSupported(a, getTopMatch(a))) ? 0 : 1;
    const bn = (hitIdentity(getTopHit(b)) < NOVEL_SOFT && novelSupported(b, getTopMatch(b))) ? 0 : 1;
    if (an !== bn) return an - bn;
    return (lastShown[a.specimen_id] || 0) - (lastShown[b.specimen_id] || 0);
  });
  // Small pool at the top so it doesn't loop the same order forever
  const pool = candidates.slice(0, Math.min(8, candidates.length));
  return pool[Math.floor(Math.random() * pool.length)].specimen_id;
}

function showNext() {
  clearTimeout(dwellTimer);
  if (paused) return;
  let card;
  // The queue is priority-sorted, so when the head is an identification at
  // priority 2+ nothing truly loud (strong novelty, milestone) is waiting —
  // roll the backlog into one burst card instead of racing through it at
  // minimum dwell. First-of-genus cards join the burst under load (amber
  // in the grid); when the room is quiet they still get a solo card.
  if (queue.length >= BURST_MIN && queue[0].priority >= 2
      && queue[0].type === 'identification') {
    const batch = queue.splice(0, BURST_MAX)
      .filter(c => c.type === 'identification');
    card = { type: 'burst', batch };
  } else {
    card = queue.length ? queue.shift() : pickFiller();
  }
  let el = null, type = card.type;
  if (type === 'identification') {
    const s = state.specimens[card.sid];
    const hit = s && getTopHit(s);
    if (!hit) { dwellTimer = setTimeout(showNext, 50); return; }
    el = renderIdentification(s, hit, card);
    lastShown[card.sid] = Date.now();
    const g = hitGenus(hit);
    if (g) announcedGenera.add(g.toLowerCase());
  } else if (type === 'burst') {
    el = renderBurst(card.batch);
  } else if (type === 'milestone') {
    el = renderMilestone(card.milestone);
  } else if (type === 'families') {
    el = renderFamilies();
  } else if (type === 'refined') {
    el = renderRefined();
  } else if (type === 'leaderboard') {
    el = renderLeaderboard();
  } else if (type === 'fieldids') {
    el = renderFieldIds();
  } else {
    el = renderStats();
  }
  swapCard(el);
  dwellTimer = setTimeout(showNext, nextDwell(type));
}

// Shrink the display name until no word overflows its line — a long epithet
// or provisional OTU name must never hyphenate mid-word on the big screen.
function fitBinomial(el) {
  if (!el) return;
  let size = parseFloat(getComputedStyle(el).fontSize);
  const min = 30;
  for (let i = 0; i < 8 && size > min && el.scrollWidth > el.clientWidth + 1; i++) {
    size = Math.max(min, size * Math.min(0.92, el.clientWidth / el.scrollWidth));
    el.style.fontSize = size + 'px';
  }
}

function swapCard(el) {
  const stage = document.getElementById('stage');
  const old = currentCardEl;
  stage.appendChild(el);
  fitBinomial(el.querySelector('.binomial'));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('visible');
    if (old) {
      old.classList.remove('visible');
      setTimeout(() => old.remove(), 1000);
    }
  }));
  currentCardEl = el;
}

// ============================================================
// Card renderers
// ============================================================
function splitBinomial(name) {
  const parts = (name || '').split(/\s+/);
  return { genus: parts[0] || '', rest: parts.slice(1).join(' ') };
}

// Similarity gauge: where this sequence sits relative to anything in the
// reference DB. The ≥98% zone reads as "a known species"; a marker outside
// it is the visual argument for novelty.
function gaugeHtml(identity) {
  const MIN = 85;
  const pct = identity * 100;
  const x = Math.max(0, (pct - MIN) / (100 - MIN) * 100);
  const zoneX = (98 - MIN) / (100 - MIN) * 100;
  return `
    <div class="gauge">
      <div class="gauge-label">closest known sequence · <b>${pct.toFixed(1)}%</b> similar</div>
      <div class="gauge-track">
        <div class="gauge-zone" style="left:${zoneX}%"></div>
        <div class="gauge-marker" style="left:${x}%"></div>
      </div>
      <div class="gauge-ticks">
        <span class="zone-tick">98–100% · known species</span>
      </div>
    </div>`;
}

function renderIdentification(s, hit, card) {
  const el = document.createElement('div');
  el.className = 'card';
  const identity = hitIdentity(hit);
  const supported = novelSupported(s, getTopMatch(s));
  const strong = identity < NOVEL_STRONG && supported;
  const soft = identity < NOVEL_SOFT && supported;
  if (strong) el.classList.add('novel');
  else if (soft) el.classList.add('novel-soft');

  // Precision matters to mycologists: distance from the reference library
  // is not the same claim as "undescribed species" — a distant sequence may
  // be undescribed, described-but-unsequenced, or just a rough read.
  let eyebrow;
  if (strong) eyebrow = 'Beyond the reference library';
  else if (soft) eyebrow = 'No close reference match';
  else if (card.firstOfGenus) eyebrow = `First ${esc(hitGenus(hit))} of the run`;
  else if (card.recycled) eyebrow = 'From this run';
  else eyebrow = 'Just identified';

  const name = splitBinomial(hit.name || hit.ref_id || '');
  const photo = (s.inat_photos || [])[0];
  if (!photo) el.classList.add('no-photo');

  // Novel headlines never present the closest match as the answer. Strong:
  // the genus with an open question. Soft: "aff." — near this species but
  // probably not it — when the epithet is a plain word ("aff. sp. 'XX01'"
  // reads badly, so provisional names keep their form).
  let nameHtml;
  if (strong) {
    nameHtml = `<span class="genus">${esc(name.genus)}</span>
      <span class="epithet"><span class="undescribed">unmatched sequence</span></span>`;
  } else if (soft && /^[a-z][a-z-]*$/.test(name.rest)) {
    nameHtml = `<span class="genus">${esc(name.genus)}</span>
      <span class="epithet"><span class="aff">aff.</span> ${esc(name.rest)}</span>`;
  } else {
    nameHtml = `<span class="genus">${esc(name.genus)}</span>
      ${name.rest ? `<span class="epithet">${esc(name.rest)}</span>` : ''}`;
  }

  const clusters = (s.clusters || []).length;
  const communityGenus = (s.community_genus || (s.community_taxon || '').split(/\s+/)[0] || '');
  const onTarget = communityGenus && isHitOnTarget(hit, communityGenus.toLowerCase());
  const observer = s.inat_observer || {};
  const obsId = (s.specimen_id.match(/iNat(\d+)/) || [])[1];

  const agreement = agreementRank(s, hit);
  let fieldHtml = '';
  if (strong) {
    fieldHtml = `Closest match: <span class="fieldname">${esc(hit.name || hit.ref_id || '')}</span>`;
    if (s.community_taxon) fieldHtml += ` · Field ID: <span class="fieldname">${esc(s.community_taxon)}</span>`;
    fieldHtml += `<br>Could be undescribed, described but never sequenced, or a rough read — one to watch.`;
  } else if (s.community_taxon) {
    // The true field ID is the observation's first identification; when a
    // later ID refined it (the display-table experts), show the journey.
    const firstName = (s.inat_first_id || {}).name || '';
    if (firstName && firstName !== s.community_taxon) {
      fieldHtml = `Field ID: <span class="fieldname">${esc(firstName)}</span>` +
        ` → <span class="fieldname">${esc(s.community_taxon)}</span>`;
    } else {
      fieldHtml = `Field ID: <span class="fieldname">${esc(s.community_taxon)}</span>`;
    }
    if ((onTarget || (agreement && GENUS_OR_DEEPER_RANKS.has(agreement.level))) && !soft) {
      const level = agreement && agreement.level === 'species' ? 'to species' : '';
      fieldHtml += ` <span class="ok">— sequence agrees${level ? ' ' + level : ''}</span>`;
    } else if (agreement && NEAR_RANKS.has(agreement.level)) {
      fieldHtml += ` <span class="ok">— same ${esc(agreement.level)}: ${esc(agreement.name)}</span>`;
    }
  }
  let creditHtml = '';
  if (observer.login) {
    creditHtml += `Collected by <b>${esc(observer.name || observer.login)}</b>`;
  }
  if (obsId) creditHtml += `${creditHtml ? ' · ' : ''}iNat observation ${esc(obsId)}`;
  if (photo && photo.attribution) creditHtml += `<br>Photo ${esc(photo.attribution)}`;

  const dataHtml = soft
    ? `<span>${fmt(s.total_reads)} reads</span>
       ${clusters ? `<span>${clusters} sequence${clusters > 1 ? 's' : ''}</span>` : ''}`
    : `<span class="identity">${(identity * 100).toFixed(1)}% identity</span>
       <span>${fmt(s.total_reads)} reads</span>
       ${clusters ? `<span>${clusters} sequence${clusters > 1 ? 's' : ''}</span>` : ''}`;

  el.innerHTML = `
    <div class="text-pane">
      <div class="eyebrow">${eyebrow}</div>
      <div class="binomial">${nameHtml}</div>
      ${soft ? gaugeHtml(identity) : ''}
      <div class="datarow">${dataHtml}</div>
      ${fieldHtml ? `<div class="fieldrow">${fieldHtml}</div>` : ''}
      ${creditHtml ? `<div class="creditrow">${creditHtml}</div>` : ''}
    </div>
    <div class="photo-pane"></div>
    <div class="ribbon"></div>`;

  if (photo) {
    const img = document.createElement('img');
    const src = photoSources(photo);
    img.alt = '';
    img.onerror = () => { if (img.src !== src.remote && src.remote) img.src = src.remote; else el.classList.add('no-photo'); };
    img.onload = () => { img.dataset.firstSrc = img.currentSrc; };
    img.src = src.local;
    el.querySelector('.photo-pane').appendChild(img);
    if ((s.inat_photos || []).length > 1) cyclePhotos(el, img, s.inat_photos);
  }
  loadRibbon(el.querySelector('.ribbon'), s, getTopMatch(s));
  return el;
}

// Cycle through the observation's photos during the card's dwell. Only the
// first photo is prefetched locally; the rest come from the iNat host, so
// each is preloaded off-screen and the card simply stays on the current
// photo if the venue network can't deliver the next one.
const PHOTO_CYCLE_MS = 4500;
function cyclePhotos(cardEl, img, photos) {
  let idx = 0;
  img.style.transition = 'opacity 0.5s ease';
  const timer = setInterval(() => {
    if (!cardEl.isConnected) { clearInterval(timer); return; }
    const nextIdx = (idx + 1) % photos.length;
    const nextSrc = nextIdx === 0
      ? (img.dataset.firstSrc || photoSources(photos[0]).local)
      : photoSources(photos[nextIdx]).remote;
    const preload = new Image();
    preload.onload = () => {
      if (!cardEl.isConnected) return;
      idx = nextIdx;
      img.style.opacity = '0';
      setTimeout(() => { img.src = nextSrc; img.style.opacity = '1'; }, 500);
    };
    preload.src = nextSrc;
  }, PHOTO_CYCLE_MS);
}

// The signature: the specimen's actual consensus bases drifting under the name.
async function loadRibbon(ribbonEl, s, match) {
  if (!ribbonEl || !match) return;
  try {
    const resp = await fetch(`/api/sequence/${encodeURIComponent(s.specimen_id)}/${encodeURIComponent(match.cluster)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    const seq = (data.sequence || '').slice(0, 400);
    if (!seq || !ribbonEl.isConnected) return;
    const colored = seq.replace(/[ACGT]/g, b => `<span class="${b}">${b}</span>`);
    ribbonEl.innerHTML = `<span class="scroll">${colored}&nbsp;&nbsp;${colored}</span>`;
  } catch (e) { /* ribbon is decoration; never let it break the card */ }
}

function runStats() {
  const all = Object.values(state.specimens);
  const identified = all.filter(hasIdentification);
  const genera = new Set();
  const taxa = new Set();
  for (const s of identified) {
    const hit = getTopHit(s);
    const g = hitGenus(hit);
    if (g) genera.add(g.toLowerCase());
    const name = hit && (hit.name || hit.ref_id);
    if (name) taxa.add(name.toLowerCase());
  }
  return { matched: state.totalMatched, identified: identified.length,
           genera: genera.size, taxa: taxa.size, total: all.length };
}

function renderStats() {
  const st = runStats();
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">Sequencing live</div>
      <div class="stat-grid">
        <div class="stat"><div class="num" data-stat="matched">${fmt(st.matched)}</div><div class="lbl">reads matched</div></div>
        <div class="stat"><div class="num"><span data-stat="identified">${fmt(st.identified)}</span><span style="color:var(--faint)">/${fmt(st.total)}</span></div><div class="lbl">specimens identified</div></div>
        <div class="stat"><div class="num" data-stat="genera">${fmt(st.genera)}</div><div class="lbl">genera so far</div></div>
      </div>
    </div>`;
  return el;
}

// Field IDs confirmed by sequencing: for each person whose FIRST
// identification on an observation names the genus the sequence later
// confirmed, count their hits. Login → display name via the observer map.
function fieldIdRows() {
  const names = {};
  for (const s of Object.values(state.specimens)) {
    const o = s.inat_observer || {};
    if (o.login) names[o.login] = o.name || o.login;
  }
  const byIdentifier = {};
  for (const s of Object.values(state.specimens)) {
    const first = s.inat_first_id || {};
    if (!first.login || !first.name || !hasIdentification(s)) continue;
    const hit = getTopHit(s);
    if (!hit) continue;
    const entry = byIdentifier[first.login] ||= { name: names[first.login] || first.login, confirmed: 0, sequenced: 0 };
    entry.sequenced++;
    const firstGenus = first.name.split(/\s+/)[0].toLowerCase();
    if (firstGenus === hitGenus(hit).toLowerCase()) entry.confirmed++;
  }
  return Object.values(byIdentifier)
    .filter(r => r.confirmed > 0)
    .sort((a, b) => b.confirmed - a.confirmed)
    .slice(0, 5);
}

function renderFieldIds() {
  const rows = fieldIdRows();
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">Field IDs confirmed by DNA</div>
      <div class="board">
        ${rows.map((r, i) => `
          <div class="board-row">
            <span class="rank">${i + 1}</span>
            <span class="who">${esc(r.name)}</span>
            <span class="count">${r.confirmed}<span style="color:var(--faint);font-size:0.6em"> of ${r.sequenced} sequenced</span></span>
          </div>`).join('')}
      </div>
    </div>`;
  return el;
}

function leaderboardRows() {
  const byObserver = {};
  for (const s of Object.values(state.specimens)) {
    if (!hasIdentification(s)) continue;
    const o = s.inat_observer || {};
    if (!o.login) continue;
    if (!byObserver[o.login]) byObserver[o.login] = { name: o.name || o.login, count: 0 };
    byObserver[o.login].count++;
  }
  return Object.values(byObserver).sort((a, b) => b.count - a.count).slice(0, 5);
}

function renderLeaderboard() {
  const rows = leaderboardRows();
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">Most specimens sequenced</div>
      <div class="board">
        ${rows.map((r, i) => `
          <div class="board-row">
            <span class="rank">${i + 1}</span>
            <span class="who">${esc(r.name)}</span>
            <span class="count">${r.count}</span>
          </div>`).join('')}
      </div>
    </div>`;
  return el;
}

// A busy stretch honored as one card: every specimen in the batch gets its
// name on screen (and counts as shown/announced) instead of being blurred
// past at minimum dwell.
function renderBurst(batch) {
  const el = document.createElement('div');
  el.className = 'card';
  const items = [];
  for (const c of batch) {
    const s = state.specimens[c.sid];
    const hit = s && getTopHit(s);
    if (!hit) continue;
    lastShown[c.sid] = Date.now();
    const g = hitGenus(hit);
    if (g) announcedGenera.add(g.toLowerCase());
    items.push({ name: hit.name || hit.ref_id || '', first: c.firstOfGenus,
                 identity: hitIdentity(hit) });
  }
  const oldest = Math.min(...batch.map(c => c.at));
  const mins = Math.max(1, Math.round((Date.now() - oldest) / 60000));
  const firsts = items.filter(it => it.first).length;
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">A busy stretch</div>
      <div class="stat">
        <div class="num">${items.length}</div>
        <div class="lbl">identifications in the last ${mins} minute${mins > 1 ? 's' : ''}${firsts ? ` · ${firsts} new gener${firsts > 1 ? 'a' : 'us'} for the run` : ''}</div>
      </div>
      <div class="burst-grid">
        ${items.map((it, i) => `
          <div class="burst-item${it.first ? ' first' : ''}" style="animation-delay:${(0.15 + i * 0.06).toFixed(2)}s">
            ${esc(it.name)}<span class="pct">${(it.identity * 100).toFixed(0)}%</span>
          </div>`).join('')}
      </div>
    </div>`;
  return el;
}

function renderMilestone(m) {
  const el = document.createElement('div');
  el.className = 'card';
  // The live span keeps pace with the footer counters (renderFooter syncs
  // [data-stat] in the current card), so the card can't read as stale even
  // when the count has already moved past the threshold.
  const current = runStats()[m.metric] || m.value;
  el.innerHTML = `
    <div class="stat-pane" style="align-items:center;text-align:center">
      <div class="eyebrow">Run milestone</div>
      <div class="milestone-num">${fmt(m.value)}</div>
      <div class="milestone-lbl">${esc(MILESTONE_LABELS[m.metric] || m.metric)}</div>
      <div class="creditrow" style="animation-delay:0.55s">now <span data-stat="${esc(m.metric)}">${fmt(current)}</span> and counting</div>
    </div>`;
  return el;
}

// The run grouped by family (order when iNat has no family for a genus),
// from the lineages already fetched for taxonomy agreement. Lineages arrive
// asynchronously over the run, so early cards undercount — the gate in
// pickFiller keeps the card off stage until it has substance.
function familyRows() {
  const counts = {};
  for (const s of Object.values(state.specimens)) {
    if (!hasIdentification(s)) continue;
    const g = hitGenus(getTopHit(s)).toLowerCase();
    const lineage = state.genusLineages[g];
    if (!lineage || !lineage.length) continue;
    const fam = lineage.find(l => l.rank === 'family') || lineage.find(l => l.rank === 'order');
    if (!fam) continue;
    counts[fam.name] = (counts[fam.name] || 0) + 1;
  }
  return Object.entries(counts)
    .map(([name, n]) => ({ name, n }))
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}

function renderFamilies() {
  const rows = familyRows();
  const top = rows.slice(0, 7);
  const max = top.length ? top[0].n : 1;
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">The run by family</div>
      <div class="stat">
        <div class="num">${rows.length}</div>
        <div class="lbl">families so far</div>
      </div>
      <div class="board" style="margin-top:3.5vh">
        ${top.map((r, i) => `
          <div class="taxo-row" style="animation-delay:${(i * 0.08).toFixed(2)}s">
            <span class="fam">${esc(r.name)}</span>
            <span class="bar" style="width:${(r.n / max * 100).toFixed(1)}%"></span>
            <span class="n">${r.n}</span>
          </div>`).join('')}
      </div>
    </div>`;
  return el;
}

// Field IDs that were sharpened at the display tables and then confirmed by
// DNA: first identification ≠ community taxon, and the sequence agrees with
// the refined name at genus or deeper. Grouped by journey, species-exact
// confirmations first — the strongest advertisement for the ID tables.
function refinedRows() {
  const groups = {};
  for (const s of Object.values(state.specimens)) {
    const from = (s.inat_first_id || {}).name || '';
    const to = s.community_taxon || '';
    if (!from || !to || from === to) continue;
    const hit = getTopHit(s);
    if (!hit) continue;
    const communityGenus = (s.community_genus || to.split(/\s+/)[0]).toLowerCase();
    const a = agreementRank(s, hit);
    if (!(isHitOnTarget(hit, communityGenus) || (a && GENUS_OR_DEEPER_RANKS.has(a.level)))) continue;
    const exact = !!a && a.level === 'species';
    const key = from + '→' + to;
    const entry = groups[key] ||= { from, to, n: 0, exact: false };
    entry.n++;
    entry.exact = entry.exact || exact;
  }
  return Object.values(groups)
    .sort((a, b) => (b.exact - a.exact) || (b.n - a.n) || a.to.localeCompare(b.to));
}

function renderRefined() {
  const rows = refinedRows().slice(0, 5);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="stat-pane">
      <div class="eyebrow">Sharpened at the ID tables</div>
      <div class="board">
        ${rows.map((r, i) => `
          <div class="journey-row" style="animation-delay:${(i * 0.1).toFixed(2)}s">
            <span class="fieldname">${esc(r.from)}</span><span class="arrow">→</span><span class="fieldname">${esc(r.to)}</span>
            <span class="ok">DNA agrees${r.exact ? ' to species' : ''}</span>${r.n > 1 ? `<span class="n">×${r.n}</span>` : ''}
          </div>`).join('')}
      </div>
      <div class="creditrow" style="animation-delay:0.6s">Field IDs refined by the identification tables, confirmed by sequencing</div>
    </div>`;
  return el;
}

// ============================================================
// Milestones: fire live when a count crosses a threshold
// ============================================================
function checkMilestones() {
  if (!bootstrapped) return;
  const st = runStats();
  for (const [metric, thresholds] of Object.entries(MILESTONES)) {
    for (const t of thresholds) {
      const key = metric + ':' + t;
      if (st[metric] >= t && !passedMilestones.has(key)) {
        passedMilestones.add(key);
        // Collapse: a newer threshold supersedes a queued lower one for the
        // same metric — showing "100" after 150 was crossed reads as stale.
        for (let i = queue.length - 1; i >= 0; i--) {
          if (queue[i].type === 'milestone' && queue[i].milestone.metric === metric
              && queue[i].milestone.value < t) queue.splice(i, 1);
        }
        // 1.5: ahead of first-of-genus, behind strong novelty — counts
        // move fast when identifications land in batches, so a milestone
        // that waits its turn behind a run of solo cards goes stale.
        enqueue({ key: 'milestone:' + key, type: 'milestone', priority: 1.5,
                  at: Date.now(), milestone: { value: t, metric } });
      }
    }
  }
}

function seedMilestones() {
  const st = runStats();
  for (const [metric, thresholds] of Object.entries(MILESTONES)) {
    for (const t of thresholds) {
      if (st[metric] >= t) passedMilestones.add(metric + ':' + t);
    }
  }
}

// ============================================================
// Footer counters + bootstrap + SSE
// ============================================================
function renderFooter() {
  const st = runStats();
  document.getElementById('ct-reads').textContent = fmt(st.matched);
  document.getElementById('ct-identified').textContent = fmt(st.identified);
  document.getElementById('ct-genera').textContent = fmt(st.genera);
  // A stats card on stage ticks live during its dwell — it must never
  // disagree with the footer counters.
  if (currentCardEl) {
    for (const [key, val] of [['matched', st.matched], ['identified', st.identified], ['genera', st.genera], ['taxa', st.taxa]]) {
      const el = currentCardEl.querySelector(`[data-stat="${key}"]`);
      if (el) el.textContent = fmt(val);
    }
  }
}

function connect() {
  const dot = document.getElementById('conn-dot');
  const es = new EventSource(`/events?after_version=${state.version}`);
  es.onopen = () => dot.classList.remove('down');
  es.onerror = () => { dot.classList.add('down'); es.close(); setTimeout(connect, 3000); };
  // EventSource only delivers named SSE events to registered listeners
  for (const type of [
    'specimens.loaded', 'specimens.taxa', 'taxa.lineage', 'specimux.completed', 'specimen.updated',
    'consensus.completed', 'identification.completed', 'summarize.completed',
  ]) {
    es.addEventListener(type, (e) => {
      const event = JSON.parse(e.data);
      state.version = Math.max(state.version, event.version);
      applyEvent(event);
      renderFooter();
      checkMilestones();
    });
  }
}

async function bootstrap() {
  try {
    const resp = await fetch('/api/state');
    const snap = await resp.json();
    state.version = snap.version || 0;
    state.totalMatched = snap.total_matched_reads || 0;
    state.genusLineages = snap.genus_lineages || {};
    state.summarizeFilter = snap.summarize_filter || {};
    for (const [sid, s] of Object.entries(snap.specimens || {})) state.specimens[sid] = s;
    // Everything in the snapshot is history: seed the genera set so only
    // genuinely new genera get the first-of-genus eyebrow.
    for (const s of Object.values(state.specimens)) {
      const g = hitGenus(getTopHit(s));
      if (g && hasIdentification(s)) announcedGenera.add(g.toLowerCase());
    }
    seedMilestones();
  } catch (e) { /* server not up yet; SSE reconnect will heal */ }
  bootstrapped = true;
  renderFooter();
  connect();
  showNext();
}

// ============================================================
// Operator keys: space = pause, → = next, f = fullscreen
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    e.preventDefault();
    paused = !paused;
    document.getElementById('paused-tag').style.display = paused ? 'inline' : 'none';
    if (!paused) showNext();
  } else if (e.key === 'ArrowRight') {
    showNext();
  } else if (e.key === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});

// Cursor hides during the show, reappears on movement
let cursorTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove('show-cursor'), 2500);
});

bootstrap();
</script>
