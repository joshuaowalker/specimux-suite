<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>specimux-suite Dashboard</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --border: #0f3460;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --accent: #0f3460;
  --waiting: #555;
  --queued: #1a6b7a;
  --processing: #c4a000;
  --updating: #7a6a1a;
  --done: #4e9a06;
  --identified: #2e7d32;
  --no-match: #8b6914;
  --no-clusters: #6a5acd;
  --error: #cc0000;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

header h1 { font-size: 1.25rem; font-weight: 600; }
#status-badge {
  font-size: 0.8rem;
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  background: var(--accent);
}
#status-badge.connected { background: var(--done); color: #fff; }
#status-badge.disconnected { background: var(--error); color: #fff; }

.controls {
  padding: 0.75rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.controls-row {
  display: flex;
  gap: 1rem;
  align-items: center;
}

#search {
  width: 300px;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
}

.stats-group {
  display: flex;
  gap: 1rem;
  font-size: 0.85rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.stats-group span { font-weight: 600; color: var(--text); }
.stats-sep {
  width: 1px;
  background: var(--border);
  align-self: stretch;
  margin: 0 0.25rem;
}

.table-wrap {
  padding: 0 1rem;
  overflow-x: auto;
}

table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 0.85rem;
}

th {
  text-align: left;
  padding: 0.6rem 0.75rem;
  border-bottom: 2px solid var(--border);
  color: var(--text-dim);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
th:hover { color: var(--text); }

td {
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

tr:hover { background: rgba(255,255,255,0.03); }

.status-pill {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
}
.status-waiting { background: var(--waiting); }
.status-queued { background: var(--queued); color: #fff; }
.status-consensus_running { background: var(--processing); color: #000; }
.status-updating { background: var(--updating); color: #fff; }
.status-consensus_done { background: var(--done); color: #fff; }
.status-identified { background: var(--identified); color: #fff; }
.status-no_match { background: var(--no-match); color: #fff; }
.status-no_clusters { background: var(--no-clusters); color: #fff; }
.status-error { background: var(--error); color: #fff; }

.identity-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 0.4rem;
  vertical-align: middle;
}

/* Column widths: Specimen | Pool | Reads | Status | Clusters | Top ID Match | Identity */
col.col-specimen { width: 28%; }
col.col-pool { width: 8%; }
col.col-reads { width: 8%; }
col.col-status { width: 9%; }
col.col-clusters { width: 7%; }
col.col-topmatch { width: 30%; }
col.col-identity { width: 10%; }

.top-hit { white-space: nowrap; }
.hit-name { font-style: italic; }
.hit-pct { color: var(--text-dim); margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

.inat-link {
  font-size: 0.7rem;
  margin-left: 0.4rem;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  background: #3a6b35;
  color: #cde6c8;
  text-decoration: none;
  vertical-align: middle;
}
.inat-link:hover { background: #4e9a06; color: #fff; }

.cluster-badge {
  display: inline-block;
  font-size: 0.7rem;
  margin-left: 0.4rem;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  cursor: pointer;
}
.cluster-badge:hover { opacity: 0.85; }
.badge-variants {
  background: var(--accent);
  color: var(--text-dim);
}
.badge-organisms {
  background: #6b3a7a;
  color: #ddc8e6;
}

.cluster-detail { background: rgba(255,255,255,0.02); }
.cluster-detail td { padding: 0.3rem 0.75rem 0.3rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.8rem; }
.cluster-detail .hit-name { color: var(--text-dim); }
.alt-hit { color: var(--text-dim); font-size: 0.75rem; }

.demux-indicator {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  background: var(--processing);
  color: #000;
  animation: pulse 1.5s ease-in-out infinite;
  margin-right: 0.5rem;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@media (max-width: 768px) {
  header { padding: 0.75rem 1rem; }
  .controls { padding: 0.5rem 1rem; }
  table { font-size: 0.8rem; }
  th, td { padding: 0.4rem 0.5rem; }
  .hide-mobile { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>specimux-suite</h1>
  <div id="status-badge" class="disconnected">disconnected</div>
</header>

<div class="controls">
  <div class="controls-row">
    <input type="text" id="search" placeholder="Search specimens...">
    <span id="stat-demuxing" class="demux-indicator" style="display:none">Demuxing</span>
  </div>
  <div class="controls-row">
    <div class="stats-group">
      Reads: <span id="stat-reads">0</span>
      &nbsp;Matched: <span id="stat-matched">0</span>
      &nbsp;Specimens: <span id="stat-total">0</span>
      <div class="stats-sep"></div>
      Identified: <span id="stat-identified">0</span>
      &nbsp;No match: <span id="stat-nomatch">0</span>
      &nbsp;Low reads: <span id="stat-lowreads">0</span>
      <div class="stats-sep"></div>
      Processing: <span id="stat-processing">0</span>
      &nbsp;Queued: <span id="stat-queued-new">0</span>
      &nbsp;Reprocess: <span id="stat-queued-reprocess">0</span>
    </div>
  </div>
</div>

<div class="table-wrap">
<table>
  <colgroup>
    <col class="col-specimen">
    <col class="col-pool">
    <col class="col-reads">
    <col class="col-status">
    <col class="col-clusters">
    <col class="col-topmatch">
    <col class="col-identity">
  </colgroup>
  <thead>
    <tr>
      <th data-sort="specimen_id">Specimen</th>
      <th data-sort="pool" class="hide-mobile">Pool</th>
      <th data-sort="total_reads">Reads</th>
      <th data-sort="status">Status</th>
      <th data-sort="clusters" class="hide-mobile">Clusters</th>
      <th>Top ID Match</th>
      <th data-sort="top_identity">Identity</th>
    </tr>
  </thead>
  <tbody id="specimen-table"></tbody>
</table>
</div>

<script>
const state = { specimens: {}, version: 0, totalInputReads: 0, demuxing: false };
let sortKey = 'specimen_id';
let sortAsc = true;
let searchTerm = '';
let minReads = 30;
let reprocessRatio = 0.5;
const expandedSpecimens = new Set();
let renderTimer = null;

function scheduleRender() {
  if (renderTimer) return;
  renderTimer = requestAnimationFrame(() => {
    renderTimer = null;
    render();
  });
}

// SSE connection
function connect() {
  const badge = document.getElementById('status-badge');
  const es = new EventSource(`/events?after_version=${state.version}`);

  es.onopen = () => {
    badge.className = 'connected';
    badge.textContent = 'live';
  };

  es.onerror = () => {
    badge.className = 'disconnected';
    badge.textContent = 'reconnecting...';
    es.close();
    setTimeout(connect, 3000);
  };

  es.onmessage = (e) => {
    const event = JSON.parse(e.data);
    state.version = event.version;
    applyEvent(event);
    scheduleRender();
  };

  // Listen for specific event types too
  for (const type of [
    'pipeline.started', 'specimens.loaded', 'specimux.started', 'specimux.completed', 'specimen.updated',
    'consensus.started', 'consensus.completed',
    'identification.completed', 'pipeline.error'
  ]) {
    es.addEventListener(type, (e) => {
      const event = JSON.parse(e.data);
      state.version = Math.max(state.version, event.version);
      applyEvent(event);
      scheduleRender();
    });
  }
}

function applyEvent(event) {
  const d = event.data;
  switch (event.type) {
    case 'pipeline.started':
      if (d.config_summary) {
        if (d.config_summary.min_reads) minReads = d.config_summary.min_reads;
        if (d.config_summary.reprocess_ratio != null) reprocessRatio = d.config_summary.reprocess_ratio;
      }
      break;
    case 'specimens.loaded':
      for (const s of (d.specimens || [])) {
        if (!state.specimens[s.specimen_id]) {
          state.specimens[s.specimen_id] = { specimen_id: s.specimen_id, total_reads: 0, status: 'waiting', clusters: [], identification: [], consensus_version: 0, reads_at_last_consensus: 0 };
        }
        if (s.pool) state.specimens[s.specimen_id].pool = s.pool;
      }
      break;
    case 'specimux.started':
      state.demuxing = true;
      break;
    case 'specimux.completed':
      state.demuxing = false;
      for (const [name, reads] of Object.entries(d.specimens || {})) {
        if (!state.specimens[name]) state.specimens[name] = { specimen_id: name, total_reads: 0, status: 'waiting', clusters: [], identification: [], consensus_version: 0, reads_at_last_consensus: 0 };
        state.specimens[name].total_reads = reads;
      }
      state.totalInputReads += d.input_reads || 0;
      break;
    case 'specimen.updated':
      if (!state.specimens[d.specimen_id]) state.specimens[d.specimen_id] = { specimen_id: d.specimen_id, total_reads: 0, status: 'waiting', clusters: [], identification: [], consensus_version: 0, reads_at_last_consensus: 0 };
      Object.assign(state.specimens[d.specimen_id], { pool: d.pool, total_reads: d.total_reads });
      break;
    case 'consensus.started':
      if (state.specimens[d.specimen_id]) state.specimens[d.specimen_id].status = 'consensus_running';
      break;
    case 'consensus.completed':
      if (state.specimens[d.specimen_id]) {
        const sc = state.specimens[d.specimen_id];
        sc.status = 'consensus_done';
        sc.clusters = d.clusters || [];
        sc.consensus_version = (sc.consensus_version || 0) + 1;
        sc.reads_at_last_consensus = sc.total_reads;
      }
      break;
    case 'identification.completed':
      if (state.specimens[d.specimen_id]) {
        const matches = d.matches || [];
        const hasHits = matches.some(m => m.top_hits && m.top_hits.length > 0);
        state.specimens[d.specimen_id].status = hasHits ? 'identified' : 'no_match';
        state.specimens[d.specimen_id].identification = matches;
      }
      break;
    case 'pipeline.error':
      if (d.specimen_id && state.specimens[d.specimen_id]) {
        state.specimens[d.specimen_id].status = 'error';
      }
      break;
  }
}

// Has this specimen ever been identified (has hits in identification array)?
function hasIdentification(s) {
  return (s.identification || []).some(m => m.top_hits && m.top_hits.length > 0);
}

// ID result category: independent of current pipeline activity
function getIdResult(s) {
  if (hasIdentification(s)) return 'identified';
  if (s.status === 'no_match') return 'no_match';
  return 'pending';
}

// Display status for the status pill in the table
function getDisplayStatus(s) {
  if (s.status === 'consensus_running') {
    return hasIdentification(s) ? 'updating' : 'consensus_running';
  }
  if (s.status === 'waiting') {
    return s.total_reads >= minReads ? 'queued' : 'waiting';
  }
  if (s.status === 'consensus_done' && (s.clusters || []).length === 0) {
    return 'no_clusters';
  }
  return s.status;
}

function inatLink(specimen_id) {
  const m = specimen_id.match(/iNat(\d+)/);
  if (!m) return '';
  return ` <a class="inat-link" href="https://www.inaturalist.org/observations/${m[1]}" target="_blank" title="iNaturalist observation">iNat</a>`;
}

function buildClusterBadge(s) {
  const clusters = s.clusters || [];
  if (clusters.length === 0) return '';
  const matches = (s.identification || []).filter(m => m.top_hits && m.top_hits.length);
  if (matches.length <= 1) {
    // Single or no ID matches — show a simple expand toggle if there are clusters
    return `<span class="cluster-badge badge-variants" data-sid="${esc(s.specimen_id)}">${clusters.length} seq${clusters.length > 1 ? 's' : ''}</span>`;
  }
  const topName = getTopHitName(s);
  let variants = 0;
  let organisms = 0;
  for (const m of matches) {
    const name = m.top_hits[0].name || m.top_hits[0].ref_id || '';
    if (name === topName) variants++;
    else organisms++;
  }
  const parts = [];
  if (variants > 1) parts.push(`<span class="cluster-badge badge-variants" data-sid="${esc(s.specimen_id)}">${variants} seqs</span>`);
  else parts.push(`<span class="cluster-badge badge-variants" data-sid="${esc(s.specimen_id)}">${clusters.length} seq${clusters.length > 1 ? 's' : ''}</span>`);
  if (organisms > 0) parts.push(`<span class="cluster-badge badge-organisms" data-sid="${esc(s.specimen_id)}">+${organisms} other${organisms > 1 ? 's' : ''}</span>`);
  return parts.join('');
}

function render() {
  let specs = Object.values(state.specimens);

  // Filter
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    specs = specs.filter(s =>
      s.specimen_id.toLowerCase().includes(q) ||
      (s.pool || '').toLowerCase().includes(q) ||
      getTopHitName(s).toLowerCase().includes(q)
    );
  }

  // Sort
  specs.sort((a, b) => {
    let va = getSortValue(a, sortKey);
    let vb = getSortValue(b, sortKey);
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  // Demuxing indicator
  document.getElementById('stat-demuxing').style.display = state.demuxing ? '' : 'none';

  // Stats — two orthogonal groups
  const all = Object.values(state.specimens);
  const totalMatchedReads = all.reduce((sum, s) => sum + (s.total_reads || 0), 0);
  const matchPct = state.totalInputReads > 0 ? ((totalMatchedReads / state.totalInputReads) * 100).toFixed(1) + '%' : '';
  document.getElementById('stat-reads').textContent = state.totalInputReads.toLocaleString();
  document.getElementById('stat-matched').textContent = totalMatchedReads.toLocaleString() + (matchPct ? ` (${matchPct})` : '');
  document.getElementById('stat-total').textContent = all.length;

  // ID results: identified / no match / low reads (not enough data to process)
  document.getElementById('stat-identified').textContent = all.filter(s => getIdResult(s) === 'identified').length;
  document.getElementById('stat-nomatch').textContent = all.filter(s => getIdResult(s) === 'no_match').length;
  document.getElementById('stat-lowreads').textContent = all.filter(s => s.total_reads < minReads).length;

  // Pipeline activity: processing / queued (new) / queued (reprocess)
  document.getElementById('stat-processing').textContent = all.filter(s => s.status === 'consensus_running').length;
  document.getElementById('stat-queued-new').textContent = all.filter(s =>
    (s.consensus_version || 0) === 0 && s.total_reads >= minReads && s.status !== 'consensus_running'
  ).length;
  document.getElementById('stat-queued-reprocess').textContent = all.filter(s => {
    if ((s.consensus_version || 0) === 0) return false;
    if (s.status === 'consensus_running') return false;
    const newReads = s.total_reads - (s.reads_at_last_consensus || 0);
    const base = s.reads_at_last_consensus || 0;
    const ratio = base > 0 ? newReads / base : (newReads > 0 ? Infinity : 0);
    return ratio > reprocessRatio;
  }).length;

  // Table
  const tbody = document.getElementById('specimen-table');
  const rows = [];
  for (const s of specs) {
    const topHit = getTopHit(s);
    const identity = topHit ? (topHit.adjusted_identity || topHit.identity || 0) : 0;
    const pct = (identity * 100).toFixed(1);
    const dotColor = identity >= 0.99 ? 'var(--identified)' : identity >= 0.98 ? 'var(--done)' : identity >= 0.90 ? 'var(--processing)' : 'var(--text-dim)';
    const displayStatus = getDisplayStatus(s);
    const statusLabels = { queued: 'queued', no_match: 'no match', no_clusters: 'no clusters', consensus_running: 'processing', consensus_done: 'ready', updating: 'updating' };
    const statusLabel = statusLabels[displayStatus] || displayStatus.replace('_', ' ');
    const clusterBadge = buildClusterBadge(s);
    const isExpanded = expandedSpecimens.has(s.specimen_id);

    rows.push(`<tr>
      <td><strong>${esc(s.specimen_id)}</strong>${inatLink(s.specimen_id)}</td>
      <td class="hide-mobile">${esc(s.pool || '')}</td>
      <td>${s.total_reads.toLocaleString()}</td>
      <td><span class="status-pill status-${displayStatus}">${statusLabel}</span></td>
      <td class="hide-mobile">${(s.clusters || []).length}</td>
      <td class="top-hit">${topHit ? `<span class="hit-name">${esc(topHit.name || topHit.ref_id || '')}</span>${clusterBadge}` : `${clusterBadge || '—'}`}</td>
      <td>${topHit ? `<span class="identity-dot" style="background:${dotColor}"></span><span class="hit-pct">${pct}%</span>` : ''}</td>
    </tr>`);

    // Expanded cluster detail rows
    if (isExpanded && (s.clusters || []).length > 0) {
      const idByCluster = {};
      for (const match of (s.identification || [])) {
        idByCluster[match.cluster] = match;
      }
      for (const cluster of s.clusters) {
        const clusterName = cluster.name || '?';
        const match = idByCluster[clusterName];
        const hits = match ? (match.top_hits || []) : [];
        const top = hits[0];
        const cId = top ? (top.adjusted_identity || top.identity || 0) : 0;
        const cPct = top ? (cId * 100).toFixed(1) : '';
        let altHits = '';
        if (hits.length > 1) {
          altHits = '<br>' + hits.slice(1, 4).map(h => {
            const hPct = ((h.adjusted_identity || h.identity || 0) * 100).toFixed(1);
            return `<span class="alt-hit">${esc(h.name || h.ref_id || '')} ${hPct}%</span>`;
          }).join('<br>');
        }
        rows.push(`<tr class="cluster-detail">
          <td colspan="2">${esc(clusterName)}</td>
          <td>${cluster.size != null ? cluster.size : ''}</td>
          <td colspan="2"></td>
          <td class="top-hit">${top ? `<span class="hit-name">${esc(top.name || top.ref_id || '')}</span>${altHits}` : '<span class="alt-hit">—</span>'}</td>
          <td>${cPct ? `<span class="hit-pct">${cPct}%</span>` : ''}</td>
        </tr>`);
      }
    }
  }
  tbody.innerHTML = rows.join('');

  // Attach cluster badge click handlers
  tbody.querySelectorAll('.cluster-badge').forEach(badge => {
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      const sid = badge.dataset.sid;
      if (expandedSpecimens.has(sid)) expandedSpecimens.delete(sid);
      else expandedSpecimens.add(sid);
      render();
    });
  });
}

function getClusterSize(s, clusterName) {
  if (!s.clusters) return null;
  const c = s.clusters.find(c => c.name === clusterName);
  return c ? c.size : null;
}

function getTopHit(s) {
  if (!s.identification || !s.identification.length) return null;
  // Find the hit from the largest cluster (by size)
  let bestHit = null;
  let bestSize = -1;
  for (const match of s.identification) {
    if (!match.top_hits || !match.top_hits.length) continue;
    const clusterSize = getClusterSize(s, match.cluster);
    const size = clusterSize !== null ? clusterSize : 0;
    if (bestHit === null || size > bestSize) {
      bestHit = match.top_hits[0];
      bestSize = size;
    }
  }
  return bestHit;
}

function getTopHitName(s) {
  const h = getTopHit(s);
  return h ? (h.name || h.ref_id || '') : '';
}

function getSortValue(s, key) {
  if (key === 'top_identity') {
    const h = getTopHit(s);
    return h ? (h.adjusted_identity || h.identity || 0) : 0;
  }
  if (key === 'clusters') return (s.clusters || []).length;
  if (key === 'status') return getDisplayStatus(s);
  return s[key] || '';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Sort headers
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    render();
  });
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

// Initial load
fetch('/api/state').then(r => r.json()).then(data => {
  if (data.specimens) {
    state.specimens = data.specimens;
    state.version = data.version || 0;
  }
  state.totalInputReads = data.total_input_reads || 0;
  if (data.config_summary) {
    if (data.config_summary.min_reads) minReads = data.config_summary.min_reads;
    if (data.config_summary.reprocess_ratio != null) reprocessRatio = data.config_summary.reprocess_ratio;
  }
  render();
  connect();
}).catch(() => connect());
</script>
</body>
</html>
